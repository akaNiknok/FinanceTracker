<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FinanceTracker</title>
    <!-- Add to Home Screen on iOS: standalone chrome-less window, dark status bar.
         icon-180/512.png are generated from the SVG in icons.js at the repo root by
         `npm run icons` — don't hand-edit them.
         `black-translucent` paints the page from y=0 under the status bar but still reports
         innerHeight as screen MINUS the top inset (797 vs 844 on a 390x844 phone), so a
         full-height shell ends 47px above the physical bottom and leaks a strip of body
         background under the nav. No CSS length sees that 47px — 100vh, 100dvh and
         visualViewport all report the short value — so --app-h below corrects it in JS.
         Switching to an opaque `black` bar would also fix it, but iOS reads these metas at
         Add-to-Home-Screen time: changing one does nothing to an already-installed app. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Runs before first paint so the shell is never laid out at the wrong height. -->
    <script>
    (function(){
      var probe=document.createElement('div');
      probe.style.cssText='position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top)';
      // ponytail: screen.height is the only value that knows the real height. The equality
      // is the guard, not a device sniff — it holds *only* in the short-window mismatch, so
      // a fixed iOS, a Safari tab, iPad, landscape and every other platform fall through to
      // innerHeight untouched. Delete the whole thing if Apple ever aligns the two.
      function fitShell(){
        document.documentElement.appendChild(probe);
        var top=parseFloat(getComputedStyle(probe).paddingTop)||0;
        probe.remove();
        var h=(screen.height===window.innerHeight+top)?screen.height:window.innerHeight;
        document.documentElement.style.setProperty('--app-h',h+'px');
      }
      fitShell();
      // Re-run once the body exists: the probe measures env() from inside <head>, where it
      // is the only element in the tree — cheap insurance against that reading 0.
      addEventListener('DOMContentLoaded',fitShell);
      addEventListener('resize',fitShell);
      addEventListener('orientationchange',fitShell);
    })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Finance">
    <meta name="theme-color" content="#0d0f14">
    <link rel="icon" href="/icon-180.png" sizes="180x180" type="image/png">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div id="app">
      <!-- Top bar (shown on every screen) -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">FinanceTracker</span>
          <!-- Hand-kept in sync with package.json; test.js fails the build if it drifts. -->
          <span class="brand-ver">v2.7.0</span>
        </div>
        <div class="topbar-right">
          <button id="refreshBtn" class="icon-btn" title="Refresh"><span class="ico">&#x21bb;</span></button>
        </div>
      </header>

      <!-- Desktop sidebar shows all items; the phone bottom-nav shows the four
           primary tabs + More (secondary screens live in the More sheet). -->
      <nav id="nav" class="nav">
        <button class="nav-item active" data-screen="dashboard"><span class="nav-ico">&#9737;</span><span class="nav-label">Dashboard</span></button>
        <button class="nav-item" data-screen="transactions"><span class="nav-ico">&#8645;</span><span class="nav-label">Transactions</span></button>
        <button class="nav-item" data-screen="budgets"><span class="nav-ico">&#9678;</span><span class="nav-label">Budgets</span></button>
        <button class="nav-item" data-screen="accounts"><span class="nav-ico">&#9636;</span><span class="nav-label">Accounts</span></button>
        <button class="nav-item secondary" data-screen="exchange"><span class="nav-ico">&#8646;</span><span class="nav-label">Swap</span></button>
        <button class="nav-item secondary" data-screen="tax"><span class="nav-ico">&#167;</span><span class="nav-label">Tax</span></button>
        <button class="nav-item secondary" data-screen="admin"><span class="nav-ico">&#9881;</span><span class="nav-label">Admin</span></button>
        <button class="nav-item nav-more" id="navMore"><span class="nav-ico">&#8943;</span><span class="nav-label">More</span></button>
      </nav>

      <!-- Screens render here -->
      <main id="main" class="main">
        <div id="bootLoader" class="boot-loader"><div class="spinner"></div><p>Loading your finances…</p></div>
      </main>

      <!-- Floating quick-add (every screen); the modal switches to a transfer in place -->
      <button id="fab" class="fab" title="Add transaction or transfer">+</button>

      <!-- More sheet (mobile secondary nav) -->
      <div id="sheetRoot" class="sheet-root" hidden>
        <div class="sheet-backdrop"></div>
        <div class="sheet">
          <div class="sheet-grab"></div>
          <div class="sheet-grid">
            <button class="sheet-item" data-screen="exchange"><span class="nav-ico">&#8646;</span>Swap</button>
            <button class="sheet-item" data-screen="tax"><span class="nav-ico">&#167;</span>Tax</button>
            <button class="sheet-item" data-screen="admin"><span class="nav-ico">&#9881;</span>Admin</button>
          </div>
        </div>
      </div>

      <!-- Modal host -->
      <div id="modalRoot" class="modal-root" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-card" id="modalCard"></div>
      </div>

      <!-- Toasts -->
      <div id="toastRoot" class="toast-root"></div>
    </div>

    <!-- End of body, not deferred: app.js runs against a built DOM, exactly as it
         did when HtmlService inlined it here. -->
    <script src="/app.js"></script>
  </body>
</html>
