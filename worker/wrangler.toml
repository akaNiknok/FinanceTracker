# Deploy:  cd worker && npx wrangler deploy   (also run by `npm run release`)
# Secrets: npx wrangler secret put GAS_URL       (run tg_gasEndpoint() to get it)
#          npx wrangler secret put APP_PASS      (the SPA passphrase)
#          npx wrangler secret put SECRET_TOKEN  (same value as TELEGRAM_SECRET_TOKEN)
name = "financetracker-telegram"
main = "worker.js"
# UTC, and Cloudflare rejects a future date — Manila is a day ahead of UTC.
compatibility_date = "2026-07-28"

# The SPA. Asset requests bypass worker.js entirely and are free/unmetered, so only
# the three routes below burn invocations.
#
# not_found_handling is deliberately left at the default: "single-page-application"
# would answer /api with index.html instead of invoking the Worker. Screen routing
# is on ?screen= query params, not paths, so there is nothing to fall back for.
[assets]
directory = "./public"
run_worker_first = ["/api", "/login", "/tg"]

# Edge read cache for /api. Version-keyed, so nothing here is ever purged — see
# cacheableRead() in worker.js. Optional: unbound, /api just proxies as before.
#   npx wrangler kv namespace create API_CACHE   → paste the id below
# NOT the Cache API: caches.default is a silent no-op on a .workers.dev subdomain.
# [[kv_namespaces]]
# binding = "API_CACHE"
# id = "<paste the id from the command above>"
