# Deploy:     cd worker && npx wrangler deploy        (also run by `npm run release`)
# Migrations: npx wrangler d1 migrations apply financetracker --remote
# Secrets:    npx wrangler secret put APP_PASS            (the SPA passphrase)
#             npx wrangler secret put SECRET_TOKEN        (= TELEGRAM_SECRET_TOKEN)
#             npx wrangler secret put TELEGRAM_BOT_TOKEN
#             npx wrangler secret put TELEGRAM_USER_ID
#             npx wrangler secret put GEMINI_API_KEY
#             npx wrangler secret put INGEST_TOKEN        (= the GAS script property)
#             npx wrangler secret put IBKR_FLEX_TOKEN
#             npx wrangler secret put IBKR_FLEX_QUERY_ID
#
# DO NOT RENAME the worker: `name` is the .workers.dev subdomain, which is both the
# Telegram webhook target and the app's URL. GAS_URL is gone — there is no Apps Script
# web app any more.
name = "financetracker-telegram"
main = "worker.js"
# UTC, and Cloudflare rejects a future date — Manila is a day ahead of UTC.
compatibility_date = "2026-07-28"

# The SPA. Asset requests bypass worker.js entirely and are free/unmetered, so only
# the three routes below burn invocations.
#
# not_found_handling is deliberately left at the default: "single-page-application"
# would answer /api with index.html instead of invoking the Worker. Screen routing is
# on ?screen= query params, not paths, so there is nothing to fall back for.
[assets]
directory = "./public"
run_worker_first = ["/api", "/login", "/tg"]

# The source of truth. --location=apac at creation time (nearest region to Manila).
#   npx wrangler d1 create financetracker --location=apac   -> paste the id below
[[d1_databases]]
binding = "DB"
database_name = "financetracker"
database_id = "0ebfbe8c-32db-434d-b59d-0b4e6ab549c3"
migrations_dir = "migrations"

# FX rates, cached 6h. This is the old API_CACHE namespace rebound: the edge read cache
# it used to hold existed to hide Apps Script latency and went away with GAS. Optional —
# unbound just means every FX lookup fetches.
[[kv_namespaces]]
binding = "FX_CACHE"
id = "414311e8408f43679204a86377b6c414"

# 1 of the 5 free cron triggers. UTC; Manila is UTC+8.
#   0 22 * * *  = 06:00 Manila — IBKR Flex -> prices (after IBKR's overnight refresh)
# The free plan does NOT retry a failed cron; src/jobs.js reports failures to Telegram.
# The daily-interest cron was removed in v2.0.1 — the bank's own figures never matched it.
[triggers]
crons = ["0 22 * * *"]

# ── staging ──────────────────────────────────────────────────────────────────
# `develop`'s deploy target — financetracker-telegram-staging.<subdomain>.workers.dev,
# redeployed by .github/workflows/staging.yml on every push to develop. It exists so a
# change can be checked from a phone before the release PR is merged.
#
# There is no `name` key on purpose: wrangler appends the environment name to the
# top-level one, so the "never rename the Worker" rule stays untouched.
#
# MOST keys are INHERITED — `main`, `compatibility_date`, `assets`, `workers_dev` and
# `triggers` — so the SPA and the routes need no repetition here. BINDINGS are not:
#   * d1_databases   repeated below, pointing at a SEPARATE database. test.js fails the
#                    build if the two ids ever match.
#   * kv_namespaces  deliberately NOT repeated. FX_CACHE is optional (unbound just means
#                    every FX lookup fetches), so staging skips the namespace entirely.
#   * triggers       INHERITED, which is the trap: without the empty override below,
#                    staging would run the 06:00 IBKR job and the net-worth snapshot
#                    against the staging database, on its own schedule.
#
# Secrets are per-Worker and are NOT copied. Staging needs exactly one —
#   npx wrangler secret put APP_PASS --env staging
# and no other, because it has no bot, no Gmail courier and no cron.
[env.staging]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "financetracker-staging"
# npx wrangler d1 create financetracker-staging --location=apac  -> paste the id here.
# The zero id below is a placeholder: the first staging deploy fails until it is real.
database_id = "d490a74a-1b5a-425a-9635-1e0011b03fb4"
migrations_dir = "migrations"

# An empty list is how one environment cancels an inherited schedule.
[env.staging.triggers]
crons = []

# NOT a secret — a deliberately wrong value. worker.js checks the Telegram header only
# when SECRET_TOKEN is SET, so leaving it unset on a public hostname would make /tg an
# open write endpoint. Staging has no bot, so every real Telegram POST must be refused.
[env.staging.vars]
SECRET_TOKEN = "staging-has-no-bot"
