<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-variant-numeric: tabular-nums;">
<div style="padding: 28px 16px 170px; display: flex; flex-direction: column; gap: 12px;">
<h1 style="margin: 0; padding: 0 4px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.5px;">Accounts</h1>
<section style="background: {{t.card}}; border-radius: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px 0;">
<div style="display: flex; flex-direction: column; align-items: center;"><span style="font-size: 12px; color: {{t.dim}};">Assets</span><span style="font-size: 17px; font-weight: 700;">₱119.4k</span></div>
<div style="display: flex; flex-direction: column; align-items: center; border-left: 1px solid {{t.sep}}; border-right: 1px solid {{t.sep}};"><span style="font-size: 12px; color: {{t.dim}};">Owe</span><span style="font-size: 17px; font-weight: 700; color: {{t.neg}};">−₱16.2k</span></div>
<div style="display: flex; flex-direction: column; align-items: center;"><span style="font-size: 12px; color: {{t.dim}};">Net</span><span style="font-size: 17px; font-weight: 700;">₱103.2k</span></div>
</section>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; justify-content: space-between; padding: 6px 4px 0; font-size: 13px; font-weight: 600; color: {{t.dim}};"><span>{{g.k}}</span><span>{{g.v}}</span></div>
<div style="background: {{t.card}}; border-radius: 16px; overflow: hidden;">
<sc-for list="{{g.rows}}" as="a" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: {{a.line}};"><span style="width: 32px; height: 32px; border-radius: 9px; background: {{a.dot}}; color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 14px;">{{a.i}}</span><div style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 17px;">{{a.k}}</span><span style="font-size: 13px; color: {{a.sc}};">{{a.s}}</span></div><span style="font-size: 17px; font-weight: 600;">{{a.v}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.dim}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; bottom: 0;"><dc-import name="TabBar" active="accounts" dark="{{dark}}" hint-size="390px,156px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
theme(d){return d?{bg:'#000000',card:'#1C1C1E',text:'#F5F5F7',dim:'#A1A1A6',sep:'#38383A',neg:'#FF453A',warn:'#FF9F0A'}:{bg:'#F2F2F7',card:'#FFFFFF',text:'#1C1C1E',dim:'#6C6C70',sep:'#E5E5EA',neg:'#C4382D',warn:'#B45309'};}
renderVals(){
var s=this.state||{}, dark=s.dark!=null?s.dark:(this.props.dark ?? true), t=this.theme(dark);
function A(k,s,v,dot,first,warn){return {k:k,s:s,v:v,dot:dot,i:k.charAt(0),line:first?'none':'1px solid '+t.sep,sc:warn?t.warn:t.dim};}
return {t:t,dark:dark,
groups:[{k:'Cash and banks',v:'₱74,107',rows:[A('BPI Banko','5.00% a year','₱26,050','#E5484D',true),A('MariBank','3.25% a year','₱13,074','#F59E0B'),A('Wise Savings','Emergency fund','$227.10','#8B5CF6'),A('Wise','USD','$200.00','#8B5CF6'),A('GCash','E-wallet','₱4,566','#3B82F6')]},
{k:'Credit',v:'−₱16,194',rows:[A('RCBC Hexagon','₱87,806 available','−₱12,194','#8E8E93',true),A('SPayLater','Limit reached','−₱4,000','#8E8E93',false,true)]}]};
}
}
</script>
</body>
</html>
