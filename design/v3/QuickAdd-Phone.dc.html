<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.dimbg}}; color: {{t.text}}; font-variant-numeric: tabular-nums;">
<div style="position: absolute; left: 0; right: 0; bottom: 0; top: 250px; background: {{t.sheet}}; border-radius: 16px 16px 0 0; padding: 6px 16px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
<div style="width: 36px; height: 5px; border-radius: 3px; background: {{t.grab}}; margin: 0 auto;"></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: {{t.field}}; border-radius: 9px; padding: 2px;">
<button style="border: 0; border-radius: 7px; height: 32px; background: {{t.card}}; color: {{t.text}}; font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15);">Spent</button>
<button style="border: 0; border-radius: 7px; height: 32px; background: transparent; color: {{t.text}}; font-size: 13px;">Earned</button>
<button style="border: 0; border-radius: 7px; height: 32px; background: transparent; color: {{t.text}}; font-size: 13px;">Moved</button>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
<span style="font-size: 44px; font-weight: 700; letter-spacing: -1px;">−₱620.00</span>
<span style="font-size: 17px; color: {{t.dim}};">Vitamins</span>
</div>
<div style="background: {{t.card}}; border-radius: 12px; overflow: hidden;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; min-height: 48px; padding: 0 16px; border-top: {{r.line}}; font-size: 17px;"><span style="width: 100px; color: {{t.dim}};">{{r.k}}</span><span style="flex-grow: 1; display: flex; align-items: center; gap: 8px;">{{r.v}}<span style="font-size: 12px; font-weight: 600; color: {{r.tc}}; background: {{r.tb}}; border-radius: 6px; padding: 1px 6px;">{{r.tag}}</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.dim}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 13px; font-weight: 600; color: {{t.dim}}; padding-left: 4px;">Or repeat one</span>
<div style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px;">
<sc-for list="{{repeat}}" as="p" hint-placeholder-count="3"><button style="flex-shrink: 0; height: 36px; padding: 0 12px; border: 1px solid {{t.sep}}; border-radius: 18px; background: {{t.card}}; color: {{t.text}}; font-size: 14px;">{{p.k}} <b>{{p.v}}</b></button></sc-for>
</div>
</div>
<div style="flex-grow: 1;"></div>
<div style="display: flex; gap: 8px; align-items: center;">
<label style="flex-grow: 1; display: flex; align-items: center; height: 50px; box-sizing: border-box; padding: 0 16px; background: {{t.card}}; border: 2px solid {{t.accent}}; border-radius: 25px; font-size: 17px;">
<span style="flex-grow: 1;"><span style="background: {{t.hl}}; border-radius: 4px;">vitamins</span> <span style="background: {{t.hl}}; border-radius: 4px;">620</span> <span style="background: {{t.hl}}; border-radius: 4px;">gcash</span><span style="display: inline-block; width: 2px; height: 20px; background: {{t.accent}}; vertical-align: middle;"></span></span>
</label>
<button aria-label="Save transaction" style="width: 50px; height: 50px; border: 0; border-radius: 25px; background: {{t.accent}}; color: #FFFFFF; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
</div>
<span style="text-align: center; font-size: 12px; color: {{t.dim}};">Return saves · works offline and syncs later</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
theme(d){return d?{dimbg:'#0B0B0D',sheet:'#1C1C1E',card:'#2C2C2E',field:'#2C2C2E',grab:'#48484A',text:'#F5F5F7',dim:'#A1A1A6',sep:'#38383A',accent:'#0A84FF',hl:'rgba(10,132,255,.28)',ess:'#64D2FF',essTint:'rgba(100,210,255,.16)'}:{dimbg:'#8E8E93',sheet:'#F2F2F7',card:'#FFFFFF',field:'#E4E4EA',grab:'#C7C7CC',text:'#1C1C1E',dim:'#6C6C70',sep:'#E5E5EA',accent:'#2463EB',hl:'#DCE6FD',ess:'#0E7C86',essTint:'#DDF1F2'};}
renderVals(){
var s=this.state||{}, dark=s.dark!=null?s.dark:!!this.props.dark, t=this.theme(dark);
function R(k,v,first,tag){return {k:k,v:v,line:first?'none':'1px solid '+t.sep,tag:tag||'',tc:t.ess,tb:tag?t.essTint:'transparent'};}
return {t:t,
rows:[R('Category','Health: Medical',true,'Essentials'),R('Account','GCash'),R('Date','Today')],
repeat:[{k:'Grab',v:'₱312'},{k:'Coffee',v:'₱180'},{k:'Mobile load',v:'₱442'}]};
}
}
</script>
</body>
</html>
