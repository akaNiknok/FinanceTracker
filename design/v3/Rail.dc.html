<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<nav style="width: 76px; height: 1180px; box-sizing: border-box; background: {{t.side}}; border-right: 1px solid {{t.sep}}; padding: 28px 0 24px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(160deg,#4A86FF,#1D4ED8); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 22px; margin-bottom: 16px;">₱</div>
<button aria-label="Summary" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: {{t.sel}}; color: {{t.accent}}; display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v9l6.4 6.4"></path></svg></button>
<button aria-label="Activity" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: {{t.dim}}; display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>
<button aria-label="Accounts" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: {{t.dim}}; display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg></button>
<button aria-label="Investments" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: {{t.dim}}; display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-7M15 9h5v5"></path></svg></button>
<div style="width: 28px; height: 1px; background: {{t.sep}}; margin: 8px 0;"></div>
<button aria-label="Swap" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: {{t.dim}}; display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"></path></svg></button>
<button aria-label="Tax" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: {{t.dim}}; display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"></path></svg></button>
<button aria-label="Admin" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: {{t.dim}}; display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
<div style="flex-grow: 1;"></div>
<span title="Synced just now" style="width: 10px; height: 10px; border-radius: 5px; background: {{t.pos}}; margin-bottom: 12px;"></span>
<button onClick="{{toggle}}" aria-label="Switch light or dark" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: {{t.card}}; color: {{t.text}}; display: grid; place-items: center;">
<sc-if value="{{dark}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{light}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
</button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"onToggle":{"editor":null},"$preview":{"width":76,"height":1180}}'>
class Component extends DCLogic {
theme(d){return d?{side:'#111113',sel:'#2C2C2E',card:'#2C2C2E',sep:'#2C2C2E',text:'#F5F5F7',dim:'#A1A1A6',accent:'#0A84FF',pos:'#30D158'}:{side:'#ECECF0',sel:'#DCDCE3',card:'#FFFFFF',sep:'#DCDCE0',text:'#1C1C1E',dim:'#6C6C70',accent:'#2463EB',pos:'#22A06B'};}
renderVals(){
var dark=this.props.dark ?? true, p=this.props;
return {t:this.theme(dark),dark:dark,light:!dark,toggle:function(){ if(p.onToggle) p.onToggle(); }};
}
}
</script>
</body>
</html>
