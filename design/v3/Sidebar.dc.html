<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<aside style="width: 240px; height: 900px; box-sizing: border-box; background: {{t.side}}; border-right: 1px solid {{t.sep}}; padding: 20px 12px 16px; display: flex; flex-direction: column; gap: 2px; color: {{t.text}}; font-size: 14px; font-family: -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px;">
<div style="width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(160deg,#4A86FF,#1D4ED8); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 17px;">₱</div>
<span style="font-size: 16px; font-weight: 700;">Finance</span>
</div>
<div style="font-size: 12px; font-weight: 600; color: {{t.dim}}; padding: 6px 10px 4px;">Overview</div>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: {{n.summary.bg}}; color: {{t.text}}; font-size: 14px; font-weight: {{n.summary.fw}}; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v9l6.4 6.4"></path></svg>Summary</button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: {{n.activity.bg}}; color: {{t.text}}; font-size: 14px; font-weight: {{n.activity.fw}}; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><span style="flex-grow: 1;">Activity</span><span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: {{t.accent}}; border-radius: 9px; padding: 0 7px;">3</span></button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: {{n.accounts.bg}}; color: {{t.text}}; font-size: 14px; font-weight: {{n.accounts.fw}}; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>Accounts</button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: {{n.investments.bg}}; color: {{t.text}}; font-size: 14px; font-weight: {{n.investments.fw}}; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-7M15 9h5v5"></path></svg>Investments</button>
<div style="font-size: 12px; font-weight: 600; color: {{t.dim}}; padding: 16px 10px 4px;">Tools</div>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: {{n.swap.bg}}; color: {{t.text}}; font-size: 14px; font-weight: {{n.swap.fw}}; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.dim}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"></path></svg>Swap</button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: {{n.tax.bg}}; color: {{t.text}}; font-size: 14px; font-weight: {{n.tax.fw}}; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.dim}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"></path></svg>Tax</button>
<button style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: {{n.admin.bg}}; color: {{t.text}}; font-size: 14px; font-weight: {{n.admin.fw}}; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.dim}}" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Admin</button>
<div style="flex-grow: 1;"></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 4px 0 10px; border-top: 1px solid {{t.sep}};">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: {{t.dim}};"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.pos}};"></span>Synced just now</span>
<button onClick="{{toggle}}" aria-label="Switch light or dark" title="Switch light or dark (Ctrl Shift L)" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: {{t.card}}; color: {{t.text}}; display: grid; place-items: center;">
<sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
</button>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["summary","activity","accounts","investments","swap","tax","admin"],"default":"summary"},"dark":{"editor":"boolean","default":false},"onToggle":{"editor":null},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
theme(d){return d?{side:'#111113',sel:'#2C2C2E',card:'#2C2C2E',sep:'#2C2C2E',text:'#F5F5F7',dim:'#A1A1A6',accent:'#0A84FF',pos:'#30D158'}:{side:'#ECECF0',sel:'#DCDCE3',card:'#FFFFFF',sep:'#DCDCE0',text:'#1C1C1E',dim:'#6C6C70',accent:'#2463EB',pos:'#22A06B'};}
renderVals(){
var dark=!!this.props.dark, t=this.theme(dark), a=this.props.active||'summary', n={};
['summary','activity','accounts','investments','swap','tax','admin'].forEach(function(k){n[k]={bg:k===a?t.sel:'transparent',fw:k===a?600:400};});
var p=this.props;
return {t:t,n:n,dark:dark,light:!dark,toggle:function(){ if(p.onToggle) p.onToggle(); }};
}
}
</script>
</body>
</html>
