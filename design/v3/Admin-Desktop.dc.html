<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-size: 14px; font-variant-numeric: tabular-nums;">
<dc-import name="Sidebar" active="admin" dark="{{dark}}" on-toggle="{{toggle}}" hint-size="240px,900px"></dc-import>
<main style="width: 1200px; display: flex; flex-direction: column;">
<dc-import name="Toolbar" heading="Admin" sub="Edit the tables behind the app" dark="{{dark}}" hint-size="1200px,76px"></dc-import>
<div style="padding: 4px 28px 28px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<div style="display: flex; background: {{t.card2}}; border-radius: 10px; padding: 3px;">
<sc-for list="{{tables}}" as="b" hint-placeholder-count="7"><button style="border: 0; border-radius: 8px; height: 32px; padding: 0 14px; background: {{b.bg}}; color: {{b.fg}}; font-size: 13px; font-weight: {{b.fw}};">{{b.k}}</button></sc-for>
</div>
<div style="display: flex; gap: 8px;">
<button style="height: 34px; padding: 0 14px; border: 1px solid {{t.sep}}; border-radius: 9px; background: {{t.card}}; color: {{t.text}}; font-size: 13px;">Export CSV</button>
<button style="height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: {{t.accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600;">+ Add category</button>
</div>
</div>
<section style="background: {{t.card}}; border-radius: 16px; overflow: hidden;">
<div style="display: grid; grid-template-columns: 50px 260px 110px 130px minmax(0, 1fr); align-items: center; height: 40px; padding: 0 16px; font-size: 12px; font-weight: 600; color: {{t.dim}}; border-bottom: 1px solid {{t.sep}};"><span>id 🔒</span><span>name 🔒</span><span>type</span><span>segment</span><span>description · the bot reads this</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 50px 260px 110px 130px minmax(0, 1fr); align-items: center; min-height: 44px; padding: 0 16px; border-bottom: 1px solid {{t.sep}};">
<span style="color: {{t.dim}};">{{r.id}}</span><span>{{r.n}}</span><span style="color: {{t.dim}};">{{r.ty}}</span>
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{r.sc}};"></span>{{r.sg}}</span>
<span style="padding: 6px 8px; margin-left: -8px; border-radius: 8px; border: {{r.bd}}; background: {{r.bg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.d}}</span>
</div>
</sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 13px; color: {{t.dim}};"><span>Names are locked: other tables point at them. Click a cell to edit it.</span><span>1–8 of 38 ·  <span style="color: {{t.accent}};">Next ›</span></span></div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
theme(d){return d?{bg:'#000000',card:'#1C1C1E',card2:'#2C2C2E',sel:'#48484A',text:'#F5F5F7',dim:'#A1A1A6',sep:'#38383A',accent:'#0A84FF',ess:'#64D2FF',rew:'#FF9F0A'}:{bg:'#F2F2F7',card:'#FFFFFF',card2:'#E4E4EA',sel:'#FFFFFF',text:'#1C1C1E',dim:'#6C6C70',sep:'#E5E5EA',accent:'#2463EB',ess:'#0E7C86',rew:'#D97706'};}
renderVals(){
var s=this.state||{}, dark=s.dark!=null?s.dark:(this.props.dark ?? true), t=this.theme(dark), self=this;
function B(k,on){return {k:k,bg:on?t.sel:'transparent',fg:on?t.text:t.dim,fw:on?600:400};}
function R(id,n,ty,sg,d,edit){return {id:id,n:n,ty:ty,sg:sg||'—',sc:sg==='Essentials'?t.ess:(sg==='Rewards'?t.rew:'transparent'),d:d,bd:edit?'2px solid '+t.accent:'2px solid transparent',bg:edit?t.bg:'transparent'};}
return {t:t,dark:dark,toggle:function(){self.setState({dark:!dark});},
tables:[B('Accounts'),B('Categories',true),B('Budgets'),B('Recurring'),B('Settings'),B('Net worth history'),B('Transactions')],
rows:[R('1','Income: Salary','Income','','Income from job / Contract Income'),R('2','Income: Side Hustle','Income','','Other freelance income'),R('3','Income: Interest','Income','','Bank/investment interest'),R('4','Income: Cashback','Income','','Bank/card rewards and vouchers'),R('6','Food: Groceries','Expense','Essentials','Supermarket / wet market'),R('7','Food: Daily Meals','Expense','Essentials','Canteen, fast food (McDo, Jollibee, KFC), solo meals|',true),R('8','Food: Coffee/Snacks','Expense','Rewards','Cafe, convenience store snacks'),R('9','Food: Dining Out','Expense','Rewards','Experience meals. Dates, nice dinners')]};
}
}
</script>
</body>
</html>
