<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter sheet phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.dimbg}}; color: {{t.text}}; font-variant-numeric: tabular-nums;">
<div style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: {{t.sheet}}; border-radius: 16px 16px 0 0; display: flex; flex-direction: column;">
<div style="width: 36px; height: 5px; border-radius: 3px; background: {{t.grab}}; margin: 6px auto 0;"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px;">
<button style="height: 44px; border: 0; background: transparent; color: {{t.accent}}; font-size: 17px; padding: 0;">Reset</button>
<span style="font-size: 17px; font-weight: 600;">Filters</span>
<button style="height: 44px; border: 0; background: transparent; color: {{t.accent}}; font-size: 17px; font-weight: 600; padding: 0;">Done</button>
</div>
<div style="flex-grow: 1; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 600; color: {{t.dim}}; padding-left: 4px;">Smart lists</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<sc-for list="{{smart}}" as="c" hint-placeholder-count="4"><button style="height: 36px; padding: 0 12px; border: 1px solid {{c.bd}}; border-radius: 18px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 600;">{{c.k}}</button></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 600; color: {{t.dim}}; padding-left: 4px;">Type</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: {{t.field}}; border-radius: 9px; padding: 2px;">
<button style="border: 0; border-radius: 7px; height: 32px; background: transparent; color: {{t.text}}; font-size: 13px;">All</button>
<button style="border: 0; border-radius: 7px; height: 32px; background: {{t.card}}; color: {{t.text}}; font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15);">Spent</button>
<button style="border: 0; border-radius: 7px; height: 32px; background: transparent; color: {{t.text}}; font-size: 13px;">Earned</button>
<button style="border: 0; border-radius: 7px; height: 32px; background: transparent; color: {{t.text}}; font-size: 13px;">Moved</button>
</div>
</div>
<div style="background: {{t.card}}; border-radius: 12px; overflow: hidden;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; min-height: 48px; padding: 0 16px; border-top: {{r.line}}; font-size: 17px;"><span style="flex-grow: 1;">{{r.k}}</span><span style="color: {{r.vc}};">{{r.v}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.dim}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 6px;"><path d="M9 6l6 6-6 6"></path></svg></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 600; color: {{t.dim}}; padding-left: 4px;">Accounts</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<sc-for list="{{accts}}" as="c" hint-placeholder-count="6"><button style="height: 36px; padding: 0 12px; border: 1px solid {{c.bd}}; border-radius: 18px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 600;">{{c.k}}</button></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 600; color: {{t.dim}}; padding-left: 4px;">Amount</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<label style="display: flex; flex-direction: column; gap: 2px; background: {{t.card}}; border-radius: 12px; padding: 8px 14px;"><span style="font-size: 12px; color: {{t.dim}};">At least</span><input aria-label="Minimum amount" value="₱300" inputmode="decimal" style="border: 0; outline: none; background: transparent; color: {{t.text}}; font-size: 17px; padding: 0;"></input></label>
<label style="display: flex; flex-direction: column; gap: 2px; background: {{t.card}}; border-radius: 12px; padding: 8px 14px;"><span style="font-size: 12px; color: {{t.dim}};">At most</span><input aria-label="Maximum amount" placeholder="Any" inputmode="decimal" style="border: 0; outline: none; background: transparent; color: {{t.text}}; font-size: 17px; padding: 0;"></input></label>
</div>
</div>
</div>
<div style="padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 8px;">
<button style="height: 50px; border: 0; border-radius: 14px; background: {{t.accent}}; color: #FFFFFF; font-size: 17px; font-weight: 600;">Show 6 results</button>
<button style="height: 40px; border: 0; background: transparent; color: {{t.accent}}; font-size: 15px;">Save as a smart list</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
theme(d){return d?{dimbg:'#0B0B0D',sheet:'#1C1C1E',card:'#2C2C2E',field:'#2C2C2E',grab:'#48484A',text:'#F5F5F7',dim:'#A1A1A6',sep:'#38383A',accent:'#0A84FF',accentTint:'rgba(10,132,255,.2)'}:{dimbg:'#8E8E93',sheet:'#F2F2F7',card:'#FFFFFF',field:'#E4E4EA',grab:'#C7C7CC',text:'#1C1C1E',dim:'#6C6C70',sep:'#E5E5EA',accent:'#2463EB',accentTint:'#EAF0FE'};}
renderVals(){
var s=this.state||{}, dark=s.dark!=null?s.dark:(this.props.dark ?? true), t=this.theme(dark);
function C(k,on){return {k:k,bg:on?t.accentTint:t.card,fg:on?t.accent:t.text,bd:on?t.accent:t.sep};}
return {t:t,
smart:[C('This month',true),C('Needs review · 3'),C('Big spends'),C('Subscriptions')],
rows:[{k:'Date',v:'September 2026',vc:t.accent,line:'none'},{k:'Category',v:'Any',vc:t.dim,line:'1px solid '+t.sep},{k:'Segment',v:'Any',vc:t.dim,line:'1px solid '+t.sep},{k:'Added from',v:'Anywhere',vc:t.dim,line:'1px solid '+t.sep}],
accts:[C('GCash ✓',true),C('Cash'),C('MariBank'),C('BPI Banko'),C('Wise'),C('RCBC Hexagon'),C('+ 6 more')]};
}
}
</script>
</body>
</html>
