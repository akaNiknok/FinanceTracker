name: Release

# The only path to live. A merge into main whose package.json version is not yet
# tagged applies the D1 migrations, deploys the Worker, tags vX.Y.Z and writes the
# GitHub Release. A push to main that does not change the version does nothing, so
# the hotfix flow (merge first, bump second) reaches live on the bump commit.
#
# Order is load-bearing and matches the old release.js: migrations run BEFORE the
# deploy, and the deploy before the tag. New code must never meet an old schema, and
# a failed deploy must abort rather than leave a tag whose halves disagree.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: Decide whether this commit releases
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already tagged. Bump the version to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $TAG."
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The GitHub environment is kept for the Deployments log, NOT as a gate: its
    # protection rules were removed on purpose (2026-08-30). Approving the
    # develop -> main PR is the approval; a second click here approved nothing new.
    # Do not add required reviewers back unless you want that click again.
    environment: production
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # The version stamp in index.html is hand-edited, and test.js fails when it
      # disagrees with package.json. This is the last gate before an irreversible deploy.
      - name: Test
        run: npm test

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 d1 migrations apply financetracker --remote

      - name: Deploy the Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      # Notes come from commit subjects, not --generate-notes: this repo commits
      # straight to develop, so PR-derived notes come out empty.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --no-merges --invert-grep --grep="^Bump version" --format="* %s" "$PREV..$TAG")
            LINK="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
          else
            LOG=$(git log --no-merges --format="* %s" "$TAG")
            LINK=""
          fi
          printf '## What'"'"'s Changed\n%s\n\n%s\n' "$LOG" "$LINK" \
            | gh release create "$TAG" --title "$TAG" --notes-file -

  # A merge into main leaves develop behind by the merge commit (or, in the hotfix
  # flow, by the bump commit). It runs on every push to main, released or not, and is
  # deliberately independent of the release job: develop must catch up even when the
  # deploy fails.
  #
  # The fast-forward is tried first, because a develop -> main release PR makes
  # develop an ancestor of main. THE HOTFIX FLOW DOES NOT: a hotfix branches off main
  # and merges to main, so develop never sees it, and any commit already sitting on
  # develop makes the two diverge. That is the common case, not an exception — it
  # failed on v2.9.1 with one merged PR waiting on develop, and the old job could
  # only stop and ask for the repair by hand.
  #
  # So a refused fast-forward now MERGES main into develop and pushes that, which is
  # the same repair a person did by hand. Nothing is ever forced: no rebase, no
  # force-push, no history rewrite. A real content conflict still stops the job,
  # because only a person can decide which side wins.
  #
  # This push carries GITHUB_TOKEN, so it starts no CI run of its own (GitHub does
  # not re-trigger workflows on a token push). Two green branches can still break
  # each other when merged, so the merge commit's first real check is the CI on the
  # next develop -> main release PR, which is the gate before main either way.
  backmerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bring develop up to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git push origin "$GITHUB_SHA":refs/heads/develop; then
            echo "::notice::develop fast-forwarded to main."
            exit 0
          fi
          # develop has its own commits. Merge, and retry if it moves under us.
          for i in 1 2 3; do
            git fetch origin develop
            git checkout -B backmerge origin/develop
            if ! git merge --no-edit -m "Back-merge main into develop" "$GITHUB_SHA"; then
              git merge --abort || true
              echo "::error::main and develop changed the same lines. Merge main into develop by hand."
              exit 1
            fi
            if git push origin HEAD:refs/heads/develop; then
              echo "::notice::Merged main into develop."
              exit 0
            fi
            echo "::warning::develop moved while the back-merge ran. Retry $i of 3."
          done
          echo "::error::develop kept moving under the back-merge. Merge main into develop by hand."
          exit 1
